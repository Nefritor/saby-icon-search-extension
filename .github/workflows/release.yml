name: Release

# Релиз выпускается тегом: `git tag v1.2.3 && git push origin v1.2.3`.
# Сборка кладёт в релиз архив расширения — именно его скачивает кнопка «Обновить»
# в самом расширении, поэтому имя файла менять нельзя.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Версия в package.json должна совпадать с тегом
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с версией ${version} в package.json" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:only
      - name: Выпустить релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/saby-icon-search-extension.zip \
            --title "Saby Icon Search ${GITHUB_REF_NAME}" \
            --generate-notes
